name: Fatal signal gate qualification
on:
  push:
    branches: [verify/pr1828-signal-20261022]
permissions:
  contents: read
jobs:
  fault:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Run actual stack-fault shard on macOS
        run: |
          uname -m
          sw_vers
          xcrun clang --version
          mkdir -p .qualification/tmp .qualification/results
          sudo mkdir -p /usr/local/bun/bin
          sudo ln -s "$(command -v bun)" /usr/local/bun/bin/bun
          export TMPDIR="$GITHUB_WORKSPACE/.qualification/tmp"
          ulimit -c 0
          bun .qualification/fault-gate.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fatal-signal-qualification
          path: .qualification/results
