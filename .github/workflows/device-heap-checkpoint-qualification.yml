name: Device heap checkpoint before
on:
  push:
    branches: [verify/1924-checkpoint-before-20261029]
permissions:
  contents: read
jobs:
  reproduce-before:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Observe actual original-runtime checkpoint after a failed allocation
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          out = root / '.qualification'
          out.mkdir(exist_ok=True)
          env = dict(os.environ, BEND_LIB=str(out / 'lib'))
          report = {
              'runtime_base': '4f99f4c19e1a91fd4c3a9377363d580171d4d40c',
              'regression_commit': 'af58e48fdc6ca3511637bb4306dc032bd4a9ec12',
              'platform': platform.platform(),
              'compiler_sha256': hashlib.sha256((root / 'bend2/comp.ts').read_bytes()).hexdigest(),
              'expected_original_bug_mask': 4,
              'issue_fix_credit': 0,
          }

          def record():
              (out / 'checkpoint-before.json').write_text(json.dumps(report, indent=2))

          def run(args, timeout=120):
              p = subprocess.run([str(a) for a in args], env=env, capture_output=True,
                                 text=True, errors='replace', timeout=timeout)
              return {'command': [str(a) for a in args], 'exit': p.returncode,
                      'stdout': p.stdout, 'stderr': p.stderr}

          report['device'] = run(['swift', '-e', 'import Metal; print(MTLCreateSystemDefaultDevice()?.name ?? "NO_METAL_DEVICE")'])
          record()
          binary = out / 'checkpoint-before'
          report['build'] = run(['bun', 'bend2/main.ts', 'tests/io/device_heap_stop.bend', '-o', binary])
          record()
          if report['build']['exit'] != 0:
              raise RuntimeError(report['build']['stderr'])
          report['actual'] = run([binary, '+RTS', '--gpu', '512MB', '-RTS'], timeout=45)
          record()
          print(json.dumps(report, indent=2), flush=True)
          if report['actual']['exit'] != 0 or report['actual']['stdout'] != '4\n':
              raise RuntimeError('original runtime did not demonstrate the missing next-step stop')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-heap-checkpoint-before
          path: .qualification/checkpoint-before.json
          include-hidden-files: true
          if-no-files-found: error
