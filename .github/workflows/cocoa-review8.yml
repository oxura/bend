name: Cocoa fullscreen review8 qualification
on:
  push:
    branches: [verify/pr1443-cocoa-review8-20261022]
permissions:
  contents: read
jobs:
  cocoa:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Build real emitted backend against macOS SDK
        run: |
          uname -m
          sw_vers
          xcrun clang --version
          mkdir -p .qualification/tmp .qualification/results
          export TMPDIR="$GITHUB_WORKSPACE/.qualification/tmp"
          bun bend2/main.ts .qualification/cocoa-probe.bend -o .qualification/cocoa-probe
          bun bend2/main.ts .qualification/cocoa-probe.bend -o .qualification/cocoa-product.c
          clang -x objective-c -fobjc-arc -fmodules -std=c11 -O3 .qualification/cocoa-review8.m -lpthread -lm -framework Cocoa -framework Metal -framework QuartzCore -o .qualification/cocoa-review8
          clang -fobjc-arc .qualification/observe.m -framework Cocoa -framework ApplicationServices -o .qualification/observe
          clang -dynamiclib -fobjc-arc .qualification/cocoa-edge.m -framework Cocoa -framework QuartzCore -o .qualification/cocoa-edge.dylib
      - name: Exercise real window surface and existing lifecycle edges
        run: |
          for mode in normal fail-enter fail-exit ignore scale; do
            BEND_COCOA_EDGE_MODE="$mode" bun .qualification/qualify-mac.ts
          done
      - name: Exercise close during started transitions and state restoration
        if: always()
        run: bun .qualification/qualify-review8.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cocoa-review8-qualification
          path: .qualification/results
